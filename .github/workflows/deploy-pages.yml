name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Write, because the build digitises new photographs and records what it
  # found back into the repository before building.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Photographs arrive carrying only what the device knew. This reads
      # each one and writes back its true dimensions, its capture time and
      # an inline placeholder.
      #
      # It runs here rather than in a workflow of its own for a practical
      # reason: a push made with GITHUB_TOKEN does not trigger further
      # workflows, so a separate job would commit the digitisation and
      # then never deploy it. Doing it in front of the build means the
      # site is built from the corrected records in the same pass.
      - name: Digitise new media
        run: node tools/ingest.mjs

      - name: Record what was digitised
        run: |
          if [ -z "$(git status --porcelain src/content/records)" ]; then
            echo "Nothing outstanding."
            exit 0
          fi
          git config user.name "Loose Nickels"
          git config user.email "noreply@loosenickels.com"
          git add src/content/records
          git commit -m "Digitise: dimensions, capture time and placeholders"
          git push

      - name: Build static website
        run: npm run build

      - name: Preserve custom domain
        run: cp CNAME out/CNAME

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
