<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loose Nickels — HTML Viewer</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f0f10;
      --fg:#f3f3f3;
      --muted:rgba(243,243,243,.6);
      --hair:rgba(243,243,243,.14);
      --panel:rgba(255,255,255,.05);

      --radius:14px;
      --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="light"]{
      --bg:#f7f6f2;
      --fg:#141414;
      --muted:rgba(20,20,20,.55);
      --hair:rgba(20,20,20,.12);
      --panel:rgba(0,0,0,.03);
    }

    *{ box-sizing:border-box }
    html,body{ height:100%; margin:0 }

    body{
      background:var(--bg);
      color:var(--fg);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .app{
      height:100%;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    .brand{
  margin-right: 10px;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: .65;
  user-select: none;
}

    /* Top bar */
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      border-bottom:1px solid var(--hair);
    }

    .left,
    .right{
      display:flex;
      align-items:center;
      gap:8px;
    }

    button{
      background:transparent;
      border:0;
      color:var(--fg);
      font-family:var(--sans);
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      cursor:pointer;
      opacity:.8;
    }

    button:hover{ opacity:1; background:var(--panel) }
    button[aria-pressed="true"]{ opacity:1 }

    .icon{
      width:18px;
      height:18px;
      display:block;
    }

    /* Main panes */
    main{
      display:grid;
      grid-template-columns:1fr;
      min-height:0;
    }

    @media (min-width:900px){
      main{ grid-template-columns:1fr 1fr }
    }

    .pane{
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    textarea{
      flex:1;
      width:100%;
      border:0;
      outline:none;
      resize:none;
      padding:14px;
      background:transparent;
      color:var(--fg);
      font-family:var(--mono);
      font-size:13px;
      line-height:1.55;
    }

    iframe{
      flex:1;
      border:0;
      background:#fff;
    }

    .hidden{ display:none }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="left">
  <div class="brand">Loose Nickels</div>

  <button id="editBtn" aria-pressed="true">Editor</button>
  <button id="previewBtn" aria-pressed="false">Preview</button>
  <button id="resetBtn">Reset</button>
</div>

      <div class="right">
        <button id="themeBtn" aria-label="Toggle theme">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none">
            <path d="M20 14.2A7.6 7.6 0 0 1 9.8 4a6.7 6.7 0 1 0 10.2 10.2Z"
                  stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="pane" id="editorPane">
        <textarea id="src" spellcheck="false"></textarea>
      </section>

      <section class="pane hidden" id="previewPane">
        <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      </section>
    </main>
  </div>

  <script>
    const root = document.documentElement;

    const src = document.getElementById('src');
    const frame = document.getElementById('preview');

    const editBtn = document.getElementById('editBtn');
    const previewBtn = document.getElementById('previewBtn');
    const resetBtn = document.getElementById('resetBtn');
    const editorPane = document.getElementById('editorPane');
    const previewPane = document.getElementById('previewPane');

    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');

    const sun = `
      <path d="M12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5
               M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17
               M7 7L5.4 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    `;
    const moon = `
      <path d="M20 14.2A7.6 7.6 0 0 1 9.8 4
               a6.7 6.7 0 1 0 10.2 10.2Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    `;

    const DEFAULT_HTML = `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
</head>
<body>
  <h1>Hello</h1>
  <p>Paste HTML above.</p>
</body>
</html>`;

    src.value = localStorage.getItem('ln_html') || DEFAULT_HTML;

    function render(){
      frame.srcdoc = src.value;
      localStorage.setItem('ln_html', src.value);
    }

    src.addEventListener('input', render);
    render();

    function showEditor(){
      editBtn.setAttribute('aria-pressed','true');
      previewBtn.setAttribute('aria-pressed','false');
      editorPane.classList.remove('hidden');
      previewPane.classList.add('hidden');
    }

    function showPreview(){
      editBtn.setAttribute('aria-pressed','false');
      previewBtn.setAttribute('aria-pressed','true');
      editorPane.classList.add('hidden');
      previewPane.classList.remove('hidden');
    }

    editBtn.onclick = showEditor;
    previewBtn.onclick = showPreview;

    resetBtn.onclick = () => {
      if(confirm('Reset editor?')){
        src.value = DEFAULT_HTML;
        render();
        showEditor();
      }
    };

    function setTheme(mode){
      if(mode === 'light'){
        root.setAttribute('data-theme','light');
        themeIcon.innerHTML = moon;
      } else {
        root.removeAttribute('data-theme');
        themeIcon.innerHTML = sun;
      }
      localStorage.setItem('ln_theme', mode);
    }

    const savedTheme = localStorage.getItem('ln_theme');
    setTheme(savedTheme === 'light' ? 'light' : 'dark');

    themeBtn.onclick = () => {
      const isLight = root.getAttribute('data-theme') === 'light';
      setTheme(isLight ? 'dark' : 'light');
    };
  </script>
</body>
</html>
