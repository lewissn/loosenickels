<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loose Nickels — Tools</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f10;
  --fg:#f3f3f3;
  --muted:rgba(243,243,243,.6);
  --hair:rgba(243,243,243,.14);
  --panel:rgba(255,255,255,.05);
  --radius:14px;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f7f6f2;
  --fg:#141414;
  --muted:rgba(20,20,20,.55);
  --hair:rgba(20,20,20,.12);
  --panel:rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  overflow:hidden;
}

.app{
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid var(--hair);
}

.left,.right{
  display:flex;
  align-items:center;
  gap:8px;
}

.brand{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

button{
  background:transparent;
  border:0;
  color:var(--fg);
  font-family:var(--sans);
  font-size:13px;
  padding:6px 10px;
  border-radius:999px;
  cursor:pointer;
  opacity:.85;
}
button:hover{opacity:1;background:var(--panel)}
button[aria-pressed="true"]{opacity:1;background:var(--panel)}

.icon{width:18px;height:18px}

.nav{display:none}
.hamburger{display:inline-flex}

@media(min-width:900px){
  .nav{display:flex;gap:8px}
  .hamburger{display:none}
}

.content{
  height:100%;
  overflow:auto;
}

.tool{
  display:none;
  height:100%;
}
.tool.active{display:block}

.split{
  height:100%;
  display:grid;
  grid-template-columns:1fr;
}
@media(min-width:900px){
  .split{grid-template-columns:1fr 1fr}
}

.pane{
  height:100%;
  display:flex;
  flex-direction:column;
}
textarea{
  flex:1;
  width:100%;
  border:0;
  resize:none;
  background:transparent;
  color:var(--fg);
  font-family:var(--mono);
  font-size:13px;
  padding:14px;
}
iframe{flex:1;border:0;background:#fff}

.wrap{
  padding:14px;
  display:grid;
  gap:14px;
}
.card{
  border:1px solid var(--hair);
  background:var(--panel);
  border-radius:var(--radius);
  padding:12px;
  display:grid;
  gap:10px;
}
.row{
  display:grid;
  gap:10px;
}
@media(min-width:700px){
  .row{grid-template-columns:1fr 1fr}
}
label{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.input{
  display:flex;
  gap:8px;
  align-items:center;
  border:1px solid var(--hair);
  border-radius:12px;
  padding:10px;
}
.input input{
  flex:1;
  border:0;
  background:transparent;
  color:var(--fg);
  font-family:var(--mono);
}
.mini{
  font-size:12px;
  border:1px solid var(--hair);
  border-radius:999px;
  padding:6px 8px;
}
.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

/* drawer */
.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  justify-content:flex-end;
  padding:10px;
}
.drawer.open{display:flex}
.drawer-panel{
  width:min(320px,90vw);
  background:var(--bg);
  border:1px solid var(--hair);
  border-radius:16px;
  padding:12px;
  display:grid;
  gap:8px;
}
</style>
</head>

<body>
<div class="app">
<header>
  <div class="left">
    <button class="hamburger" id="menuBtn">☰</button>
    <div class="brand">Loose Nickels</div>
    <div class="nav">
      <button data-tool="html">HTML</button>
      <button data-tool="colors">Colours</button>
      <button data-tool="convert">Convert</button>
      <button data-tool="weight">Weight</button>
    </div>
  </div>
  <div class="right">
    <button id="themeBtn">◐</button>
  </div>
</header>

<div class="content" id="content">

<section class="tool active" id="html">
  <div class="split">
    <div class="pane">
      <textarea id="htmlSrc"></textarea>
    </div>
    <div class="pane">
      <iframe id="htmlPrev"></iframe>
    </div>
  </div>
</section>

<section class="tool" id="convert">
<div class="wrap">

<div class="card">
<label>px ↔ rem / em</label>
<div class="row">
  <div class="input"><input id="px" placeholder="16"></div>
  <div class="input"><input id="base" placeholder="16"></div>
</div>
<div class="row">
  <div class="input"><input id="rem" readonly></div>
  <div class="input"><input id="em" readonly></div>
</div>
<div class="note">
rem = relative to root font-size.  
em = relative to current element.
</div>
</div>

<div class="card">
<label>mm ↔ inches</label>
<div class="row">
  <div class="input"><input id="mm" placeholder="25.4"></div>
  <div class="input"><input id="inch" placeholder="1"></div>
</div>
</div>

<div class="card">
<label>Edgeband roll length</label>
<div class="row">
  <div class="input"><input id="ebT" placeholder="0.8"></div>
  <div class="input"><input id="ebDo" placeholder="200"></div>
</div>
<div class="row">
  <div class="input"><input id="ebDi" placeholder="76"></div>
  <div class="input"><input id="ebOut" readonly></div>
</div>
<div class="note">meters on roll</div>
</div>

</div>
</section>

<section class="tool" id="weight">
<div class="wrap">
<div class="card">
<label>Panel weight</label>
<div id="rows"></div>
<button id="addRow">Add line</button>
<div class="note" id="totalKg"></div>
</div>
</div>
</section>

</div>
</div>

<div class="drawer" id="drawer">
<div class="drawer-panel">
<button data-tool="html">HTML</button>
<button data-tool="colors">Colours</button>
<button data-tool="convert">Convert</button>
<button data-tool="weight">Weight</button>
<button id="closeDrawer">Close</button>
</div>
</div>

<script>
const tools=[...document.querySelectorAll('.tool')];
document.querySelectorAll('[data-tool]').forEach(b=>{
  b.onclick=()=>{
    tools.forEach(t=>t.classList.remove('active'));
    document.getElementById(b.dataset.tool).classList.add('active');
    drawer.classList.remove('open');
  };
});

menuBtn.onclick=()=>drawer.classList.add('open');
closeDrawer.onclick=()=>drawer.classList.remove('open');

themeBtn.onclick=()=>{
  document.documentElement.toggleAttribute('data-theme','light');
};

const src=document.getElementById('htmlSrc');
const prev=document.getElementById('htmlPrev');
src.value='<!doctype html><h1>Hello</h1>';
src.oninput=()=>prev.srcdoc=src.value;
prev.srcdoc=src.value;

// converters
function n(v){return parseFloat(v)||0;}
px.oninput=base.oninput=()=>{
  rem.value=(n(px.value)/n(base.value)||0).toFixed(4)+'rem';
  em.value=rem.value.replace('rem','em');
};
mm.oninput=()=>inch.value=(n(mm.value)/25.4).toFixed(4);
inch.oninput=()=>mm.value=(n(inch.value)*25.4).toFixed(2);

// edgeband
function eb(){
  const L=(Math.PI/4)*(n(ebDo.value)**2-n(ebDi.value)**2)/n(ebT.value)/1000;
  ebOut.value=L?L.toFixed(2):'';
}
ebT.oninput=ebDo.oninput=ebDi.oninput=eb;

// weight
const densities={
  'MDF 6':750,'MDF 18':750,'MDF 22':750,
  'MFC 8':700,'MFC 18':700
};
function addRow(){
  const d=document.createElement('div');
  d.className='row';
  d.innerHTML=`
  <select>
    ${Object.keys(densities).map(k=>`<option>${k}</option>`).join('')}
  </select>
  <input placeholder="m²">
  <span>kg</span>`;
  rows.appendChild(d);
}
addRow();
addRow();
</script>
</body>
</html>
