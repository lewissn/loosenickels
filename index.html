<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loose Nickels — Tools</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f0f10;
      --fg:#f3f3f3;
      --muted:rgba(243,243,243,.6);
      --hair:rgba(243,243,243,.14);
      --panel:rgba(255,255,255,.05);

      --radius:14px;
      --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    [data-theme="light"]{
      --bg:#f7f6f2;
      --fg:#141414;
      --muted:rgba(20,20,20,.55);
      --hair:rgba(20,20,20,.12);
      --panel:rgba(0,0,0,.03);
    }

    *{ box-sizing:border-box }
    html,body{ height:100%; margin:0 }
    body{
      background:var(--bg);
      color:var(--fg);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }

    .app{
      height:100%;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 14px;
      border-bottom:1px solid var(--hair);
    }

    .left, .right{
      display:flex;
      align-items:center;
      gap:8px;
      min-width: 0;
    }

    .brand{
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      opacity:.75;
      user-select:none;
      margin-right:6px;
      white-space:nowrap;
    }

    button{
      background:transparent;
      border:0;
      color:var(--fg);
      font-family:var(--sans);
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      cursor:pointer;
      opacity:.82;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover{ opacity:1; background:var(--panel) }
    button[aria-pressed="true"]{ opacity:1; background:var(--panel) }

    .icon{ width:18px; height:18px; display:block; }

    /* content areas */
    .tool{ height:100%; min-height:0; display:none; }
    .tool.active{ display:block; }

    /* --- HTML tool --- */
    .split{
      height:100%;
      display:grid;
      grid-template-columns:1fr;
      min-height:0;
    }
    @media (min-width:900px){
      .split{ grid-template-columns:1fr 1fr; }
    }
    .pane{ min-height:0; display:flex; flex-direction:column; }
    textarea{
      flex:1;
      width:100%;
      border:0;
      outline:none;
      resize:none;
      padding:14px;
      background:transparent;
      color:var(--fg);
      font-family:var(--mono);
      font-size:13px;
      line-height:1.55;
    }
    iframe{
      flex:1;
      border:0;
      background:#fff;
    }
    .hidden{ display:none; }

    /* --- Colours tool --- */
    .colors-wrap{
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    .colors-top{
      padding:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      border-bottom:1px solid var(--hair);
    }

    @media (min-width:900px){
      .colors-top{
        grid-template-columns: 1.25fr .75fr;
        align-items:start;
      }
    }

    .card{
      border:1px solid var(--hair);
      background:var(--panel);
      border-radius:var(--radius);
      padding:12px;
      display:grid;
      gap:10px;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap:8px;
    }
    @media (min-width:700px){
      .row{ grid-template-columns: 1fr 1fr; }
    }

    .field label{
      display:block;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0 0 6px;
    }

    .input{
      display:flex;
      gap:8px;
      align-items:center;
      border:1px solid var(--hair);
      border-radius:12px;
      padding:10px 10px;
      background:transparent;
    }
    .input input{
      width:100%;
      border:0;
      outline:none;
      background:transparent;
      color:var(--fg);
      font-family:var(--mono);
      font-size:13px;
    }
    .mini{
      font-family:var(--sans);
      font-size:12px;
      padding:6px 8px;
      border:1px solid var(--hair);
      background:transparent;
      border-radius:999px;
      opacity:.85;
    }
    .mini:hover{ opacity:1; background:var(--panel) }

    .swatch{
      border:1px solid var(--hair);
      border-radius:14px;
      overflow:hidden;
      min-height: 132px;
      display:grid;
      grid-template-rows: 1fr auto;
      background:#111;
    }
    .swatch-top{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      font-weight:600;
      letter-spacing:-.01em;
    }
    .swatch-bottom{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      border-top:1px solid rgba(127,127,127,.18);
      font-size:12px;
      font-family:var(--mono);
      opacity:.9;
      gap:10px;
    }

    .badges{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(127,127,127,.25);
      background:rgba(255,255,255,.08);
      color:inherit;
      opacity:.9;
      font-family:var(--sans);
      white-space:nowrap;
    }
    [data-theme="light"] .badge{
      background:rgba(0,0,0,.04);
    }

    .colors-main{
      min-height:0;
      padding:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      overflow:auto;
    }

    @media (min-width:900px){
      .colors-main{
        grid-template-columns: 1fr 1fr;
      }
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap:10px;
    }

    .chip{
      border:1px solid var(--hair);
      border-radius:14px;
      overflow:hidden;
      background:var(--panel);
      min-height:84px;
      display:grid;
      grid-template-rows: 1fr auto;
    }
    .chip .c{
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      font-size:12px;
    }
    .chip .meta{
      padding:8px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border-top:1px solid rgba(127,127,127,.18);
      font-family:var(--mono);
      font-size:11px;
      opacity:.9;
    }
    .ok{ opacity:1; }
    .dim{ opacity:.55; }

    .note{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="left">
        <div class="brand">Loose Nickels</div>

        <button id="toolHtml" aria-pressed="true">HTML</button>
        <button id="toolColors" aria-pressed="false">Colours</button>

        <button id="resetBtn">Reset</button>
      </div>

      <div class="right">
        <button id="themeBtn" aria-label="Toggle theme">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none"></svg>
        </button>
      </div>
    </header>

    <!-- HTML TOOL -->
    <section class="tool active" id="htmlTool">
      <div class="split">
        <section class="pane" id="editorPane">
          <textarea id="src" spellcheck="false"></textarea>
        </section>

        <section class="pane hidden" id="previewPane">
          <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        </section>
      </div>
    </section>

    <!-- COLOURS TOOL -->
    <section class="tool" id="colorsTool">
      <div class="colors-wrap">
        <div class="colors-top">
          <div class="card">
            <div class="row">
              <div class="field">
                <label>Hex</label>
                <div class="input">
                  <input id="hexIn" placeholder="#1a73e8" />
                  <button class="mini" id="copyHex">Copy</button>
                </div>
              </div>

              <div class="field">
                <label>RGB</label>
                <div class="input">
                  <input id="rgbIn" placeholder="rgb(26, 115, 232)" />
                  <button class="mini" id="copyRgb">Copy</button>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label>Text recommendation</label>
                <div class="input">
                  <input id="recText" readonly />
                  <button class="mini" id="copyRec">Copy</button>
                </div>
              </div>

              <div class="field">
                <label>Custom background for contrast</label>
                <div class="input">
                  <input id="bgIn" placeholder="#ffffff (optional)" />
                  <button class="mini" id="useBg">Use</button>
                </div>
              </div>
            </div>

            <div class="note" id="contrastNote"></div>
          </div>

          <div class="swatch" id="swatch">
            <div class="swatch-top" id="swatchTop">Preview</div>
            <div class="swatch-bottom">
              <span id="swatchMeta">#000000</span>
              <div class="badges" id="badges"></div>
            </div>
          </div>
        </div>

        <div class="colors-main">
          <div class="card">
            <div class="field">
              <label>Tints & shades</label>
              <div class="grid" id="tintsGrid"></div>
            </div>
          </div>

          <div class="card">
            <div class="field">
              <label>Accompanying colours</label>
              <div class="grid" id="accGrid"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ---------- Theme ----------
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');

    const sun = `
      <path d="M12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5
               M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17
               M7 7L5.4 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    `;
    const moon = `
      <path d="M20 14.2A7.6 7.6 0 0 1 9.8 4
               a6.7 6.7 0 1 0 10.2 10.2Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    `;

    function setTheme(mode){
      if(mode === 'light'){
        root.setAttribute('data-theme','light');
        themeIcon.innerHTML = moon;
      } else {
        root.removeAttribute('data-theme');
        themeIcon.innerHTML = sun;
      }
      localStorage.setItem('ln_theme', mode);
    }
    setTheme(localStorage.getItem('ln_theme') === 'light' ? 'light' : 'dark');
    themeBtn.onclick = () => setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

    // ---------- Tool switching ----------
    const toolHtml = document.getElementById('toolHtml');
    const toolColors = document.getElementById('toolColors');
    const htmlTool = document.getElementById('htmlTool');
    const colorsTool = document.getElementById('colorsTool');

    function showTool(which){
      const isHtml = which === 'html';
      toolHtml.setAttribute('aria-pressed', String(isHtml));
      toolColors.setAttribute('aria-pressed', String(!isHtml));
      htmlTool.classList.toggle('active', isHtml);
      colorsTool.classList.toggle('active', !isHtml);
      localStorage.setItem('ln_tool', which);
    }
    toolHtml.onclick = () => showTool('html');
    toolColors.onclick = () => showTool('colors');
    showTool(localStorage.getItem('ln_tool') === 'colors' ? 'colors' : 'html');

    // ---------- Reset ----------
    const resetBtn = document.getElementById('resetBtn');

    // HTML tool elements
    const src = document.getElementById('src');
    const frame = document.getElementById('preview');
    const editorPane = document.getElementById('editorPane');
    const previewPane = document.getElementById('previewPane');

    const DEFAULT_HTML = `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
</head>
<body>
  <h1>Hello</h1>
  <p>Paste HTML above.</p>
</body>
</html>`;

    src.value = localStorage.getItem('ln_html') || DEFAULT_HTML;
    function renderHtml(){
      frame.srcdoc = src.value;
      localStorage.setItem('ln_html', src.value);
    }
    src.addEventListener('input', renderHtml);
    renderHtml();

    // mobile: tap preview button? keep it simple: show preview when switching tool? Nah—use split on desktop, editor-only on mobile.
    function updateHtmlLayout(){
      const small = window.matchMedia('(max-width: 899px)').matches;
      previewPane.classList.toggle('hidden', small);
    }
    window.addEventListener('resize', updateHtmlLayout);
    updateHtmlLayout();

    // ---------- Colours tool ----------
    const hexIn = document.getElementById('hexIn');
    const rgbIn = document.getElementById('rgbIn');
    const bgIn = document.getElementById('bgIn');
    const useBg = document.getElementById('useBg');

    const copyHex = document.getElementById('copyHex');
    const copyRgb = document.getElementById('copyRgb');
    const recText = document.getElementById('recText');
    const copyRec = document.getElementById('copyRec');

    const swatch = document.getElementById('swatch');
    const swatchTop = document.getElementById('swatchTop');
    const swatchMeta = document.getElementById('swatchMeta');
    const badges = document.getElementById('badges');
    const contrastNote = document.getElementById('contrastNote');

    const tintsGrid = document.getElementById('tintsGrid');
    const accGrid = document.getElementById('accGrid');

    const LS_COL = 'ln_color_base';
    const LS_BG  = 'ln_color_bg';

    // --- parsing / formatting ---
    function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }

    function normHex(h){
      h = (h || '').trim().toLowerCase();
      if(!h) return null;
      if(h.startsWith('rgb')) return null;
      if(h[0] !== '#') h = '#' + h;
      const m3 = h.match(/^#([0-9a-f]{3})$/i);
      if(m3){
        const s = m3[1];
        return '#' + s[0]+s[0] + s[1]+s[1] + s[2]+s[2];
      }
      const m6 = h.match(/^#([0-9a-f]{6})$/i);
      if(m6) return '#' + m6[1];
      return null;
    }

    function hexToRgb(hex){
      const h = normHex(hex);
      if(!h) return null;
      const n = parseInt(h.slice(1), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function rgbToHex(r,g,b){
      const to2 = (x)=> clamp(x,0,255).toString(16).padStart(2,'0');
      return '#' + to2(r) + to2(g) + to2(b);
    }

    function parseRgb(s){
      s = (s || '').trim().toLowerCase();
      if(!s) return null;
      const m = s.match(/rgb\(\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*\)/i)
            || s.match(/^([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})$/i);
      if(!m) return null;
      const r = clamp(parseInt(m[1],10),0,255);
      const g = clamp(parseInt(m[2],10),0,255);
      const b = clamp(parseInt(m[3],10),0,255);
      return {r,g,b};
    }

    function fmtRgb({r,g,b}){ return `rgb(${r}, ${g}, ${b})`; }

    // --- WCAG contrast ---
    function srgbToLin(c){
      c /= 255;
      return (c <= 0.04045) ? (c / 12.92) : Math.pow((c + 0.055) / 1.055, 2.4);
    }
    function relLum({r,g,b}){
      const R = srgbToLin(r), G = srgbToLin(g), B = srgbToLin(b);
      return 0.2126*R + 0.7152*G + 0.0722*B;
    }
    function contrast(a,b){
      const L1 = relLum(a), L2 = relLum(b);
      const hi = Math.max(L1,L2), lo = Math.min(L1,L2);
      return (hi + 0.05) / (lo + 0.05);
    }
    function wcagLabel(r){
      // normal text: AA>=4.5, AAA>=7 ; large text: AA>=3, AAA>=4.5
      if(r >= 7) return 'AAA';
      if(r >= 4.5) return 'AA';
      if(r >= 3) return 'AA Large';
      return 'Fail';
    }

    // --- HSL helpers for palette ---
    function rgbToHsl({r,g,b}){
      r/=255; g/=255; b/=255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h=0, s=0, l=(max+min)/2;
      if(max !== min){
        const d = max-min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max){
          case r: h = (g-b)/d + (g < b ? 6 : 0); break;
          case g: h = (b-r)/d + 2; break;
          case b: h = (r-g)/d + 4; break;
        }
        h *= 60;
      }
      return { h, s, l };
    }
    function hslToRgb({h,s,l}){
      const C = (1 - Math.abs(2*l - 1)) * s;
      const hp = (h % 360) / 60;
      const X = C * (1 - Math.abs((hp % 2) - 1));
      let r1=0,g1=0,b1=0;
      if(0<=hp && hp<1){ r1=C; g1=X; b1=0; }
      else if(1<=hp && hp<2){ r1=X; g1=C; b1=0; }
      else if(2<=hp && hp<3){ r1=0; g1=C; b1=X; }
      else if(3<=hp && hp<4){ r1=0; g1=X; b1=C; }
      else if(4<=hp && hp<5){ r1=X; g1=0; b1=C; }
      else { r1=C; g1=0; b1=X; }
      const m = l - C/2;
      return {
        r: Math.round((r1+m)*255),
        g: Math.round((g1+m)*255),
        b: Math.round((b1+m)*255),
      };
    }

    function mix(a,b,t){
      return {
        r: Math.round(a.r + (b.r-a.r)*t),
        g: Math.round(a.g + (b.g-a.g)*t),
        b: Math.round(a.b + (b.b-a.b)*t),
      };
    }

    function bestTextOn(bg){
      const white = {r:255,g:255,b:255};
      const black = {r:0,g:0,b:0};
      const cw = contrast(bg, white);
      const cb = contrast(bg, black);
      return (cw >= cb) ? { rgb:white, label:`#ffffff • ${cw.toFixed(2)}:1 (${wcagLabel(cw)})` }
                        : { rgb:black, label:`#000000 • ${cb.toFixed(2)}:1 (${wcagLabel(cb)})` };
    }

    function chipEl(hex, bgRgb, textRgb){
      const el = document.createElement('div');
      el.className = 'chip';

      const c = document.createElement('div');
      c.className = 'c';
      c.style.background = hex;
      c.style.color = rgbToHex(textRgb.r,textRgb.g,textRgb.b);
      c.textContent = 'Aa';

      const m = document.createElement('div');
      m.className = 'meta';

      const left = document.createElement('span');
      left.textContent = hex.toLowerCase();

      const ratio = contrast(bgRgb, textRgb);
      const lab = wcagLabel(ratio);
      const right = document.createElement('span');
      right.textContent = `${ratio.toFixed(2)} ${lab}`;
      right.className = (lab === 'Fail') ? 'dim' : 'ok';

      m.appendChild(left);
      m.appendChild(right);

      el.appendChild(c);
      el.appendChild(m);

      el.addEventListener('click', async () => {
        try{
          await navigator.clipboard.writeText(hex.toLowerCase());
        } catch {}
      });

      return el;
    }

    function setBadges(items){
      badges.innerHTML = '';
      for(const it of items){
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = it;
        badges.appendChild(b);
      }
    }

    function updateFromBase(baseRgb){
      const baseHex = rgbToHex(baseRgb.r, baseRgb.g, baseRgb.b).toLowerCase();
      const baseRgbStr = fmtRgb(baseRgb);

      hexIn.value = baseHex;
      rgbIn.value = baseRgbStr;
      localStorage.setItem(LS_COL, baseHex);

      // preview swatch
      swatch.style.background = baseHex;

      // custom bg if supplied, else base itself as background for text rec
      const bgHex = normHex(bgIn.value) || localStorage.getItem(LS_BG) || null;
      const bgRgb = bgHex ? hexToRgb(bgHex) : baseRgb;

      // best text colour on base + on custom bg
      const onBase = bestTextOn(baseRgb);
      const onBg = bestTextOn(bgRgb);

      // show recommendation for base colour (most common use)
      recText.value = onBase.label;

      // swatch text uses best text on base
      const swatchTextHex = rgbToHex(onBase.rgb.r,onBase.rgb.g,onBase.rgb.b);
      swatchTop.style.background = baseHex;
      swatchTop.style.color = swatchTextHex;
      swatchTop.textContent = 'Loose Nickels';
      swatchMeta.textContent = `${baseHex}  •  ${baseRgbStr}`;

      // contrast badges (base vs white/black, and vs optional background)
      const white = {r:255,g:255,b:255}, black = {r:0,g:0,b:0};
      const cW = contrast(baseRgb, white);
      const cB = contrast(baseRgb, black);

      const badgeItems = [
        `on #fff: ${cW.toFixed(2)} (${wcagLabel(cW)})`,
        `on #000: ${cB.toFixed(2)} (${wcagLabel(cB)})`,
      ];
      if(bgHex){
        const chosen = bestTextOn(bgRgb);
        badgeItems.push(`bg ${bgHex.toLowerCase()}: ${wcagLabel(contrast(bgRgb, chosen.rgb))}`);
      }
      setBadges(badgeItems);

      // a useful “sentence” for your brain:
      const baseText = bestTextOn(baseRgb);
      const baseRatio = contrast(baseRgb, baseText.rgb);
      contrastNote.textContent =
        `Best text on ${baseHex} is ${rgbToHex(baseText.rgb.r,baseText.rgb.g,baseText.rgb.b)} ` +
        `with contrast ${baseRatio.toFixed(2)}:1 (${wcagLabel(baseRatio)} for normal text).`;

      // tints & shades (mix with white/black)
      tintsGrid.innerHTML = '';
      const w = {r:255,g:255,b:255}, k = {r:0,g:0,b:0};

      const steps = [0.82, 0.64, 0.46, 0.28, 0.10]; // toward white
      const steps2 = [0.10, 0.28, 0.46, 0.64, 0.82]; // toward black

      // tints row (lighter)
      for(const t of steps){
        const rgb = mix(baseRgb, w, t);
        const hex = rgbToHex(rgb.r,rgb.g,rgb.b).toLowerCase();
        const text = bestTextOn(rgb).rgb;
        tintsGrid.appendChild(chipEl(hex, rgb, text));
      }
      // shades row (darker)
      for(const t of steps2){
        const rgb = mix(baseRgb, k, t);
        const hex = rgbToHex(rgb.r,rgb.g,rgb.b).toLowerCase();
        const text = bestTextOn(rgb).rgb;
        tintsGrid.appendChild(chipEl(hex, rgb, text));
      }

      // accompanying colours (complementary, split, analogous)
      accGrid.innerHTML = '';
      const hsl = rgbToHsl(baseRgb);

      const variants = [
        { name:'Complement', h: (hsl.h + 180) % 360, s:hsl.s, l:hsl.l },
        { name:'Split +',   h: (hsl.h + 150) % 360, s:hsl.s, l:hsl.l },
        { name:'Split -',   h: (hsl.h + 210) % 360, s:hsl.s, l:hsl.l },
        { name:'Analog +',  h: (hsl.h + 30)  % 360, s:hsl.s, l:hsl.l },
        { name:'Analog -',  h: (hsl.h + 330) % 360, s:hsl.s, l:hsl.l },
        { name:'Triad +',   h: (hsl.h + 120) % 360, s:hsl.s, l:hsl.l },
        { name:'Triad -',   h: (hsl.h + 240) % 360, s:hsl.s, l:hsl.l },
        { name:'Soft comp', h: (hsl.h + 180) % 360, s: Math.min(1, hsl.s * 0.72), l: clamp(hsl.l * 1.02, 0, 1) },
        { name:'Muted',     h: hsl.h, s: Math.min(1, hsl.s * 0.55), l: clamp(hsl.l * 1.05, 0, 1) },
        { name:'Deep',      h: hsl.h, s: hsl.s, l: clamp(hsl.l * 0.72, 0, 1) },
      ];

      // Show 10 chips. Each chip indicates contrast of "Aa" against itself is irrelevant.
      // More useful: show whether this colour would be readable with auto-picked text.
      for(const v of variants){
        const rgb = hslToRgb(v);
        const hex = rgbToHex(rgb.r,rgb.g,rgb.b).toLowerCase();
        const text = bestTextOn(rgb).rgb;
        accGrid.appendChild(chipEl(hex, rgb, text));
      }
    }

    function setBaseFromAny(input){
      const asHex = normHex(input);
      if(asHex){
        const rgb = hexToRgb(asHex);
        if(rgb) return updateFromBase(rgb);
      }
      const asRgb = parseRgb(input);
      if(asRgb){
        return updateFromBase(asRgb);
      }
    }

    // initialise colours tool
    const savedCol = localStorage.getItem(LS_COL) || '#1a73e8';
    hexIn.value = savedCol;
    bgIn.value = localStorage.getItem(LS_BG) || '';
    setBaseFromAny(savedCol);

    hexIn.addEventListener('input', () => setBaseFromAny(hexIn.value));
    rgbIn.addEventListener('input', () => setBaseFromAny(rgbIn.value));

    useBg.addEventListener('click', () => {
      const bg = normHex(bgIn.value);
      if(bg){
        localStorage.setItem(LS_BG, bg);
        setBaseFromAny(hexIn.value);
      } else {
        localStorage.removeItem(LS_BG);
        bgIn.value = '';
        setBaseFromAny(hexIn.value);
      }
    });

    // Copy helpers
    async function copyText(t){
      try{ await navigator.clipboard.writeText(t); } catch {}
    }
    copyHex.onclick = () => copyText(hexIn.value.trim().toLowerCase());
    copyRgb.onclick = () => {
      const rgb = parseRgb(rgbIn.value) || hexToRgb(hexIn.value);
      if(rgb) copyText(fmtRgb(rgb));
    };
    copyRec.onclick = () => copyText(recText.value.split('•')[0].trim());

    // Reset button behaviour: reset current tool
    resetBtn.onclick = () => {
      const which = localStorage.getItem('ln_tool') === 'colors' ? 'colors' : 'html';
      if(which === 'html'){
        if(confirm('Reset HTML editor?')){
          src.value = DEFAULT_HTML;
          renderHtml();
          localStorage.setItem('ln_tool','html');
          showTool('html');
        }
      } else {
        if(confirm('Reset colour tool?')){
          localStorage.removeItem(LS_COL);
          localStorage.removeItem(LS_BG);
          hexIn.value = '#1a73e8';
          rgbIn.value = '';
          bgIn.value = '';
          setBaseFromAny(hexIn.value);
          localStorage.setItem('ln_tool','colors');
          showTool('colors');
        }
      }
    };
  </script>
</body>
</html>
