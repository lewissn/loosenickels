# XcodeGen spec for the daily archive app.
#
#   brew install xcodegen
#   cd ios && xcodegen
#
# Generates Accession.xcodeproj from the sources next to this file. The
# project is disposable — regenerate it rather than editing it, and keep
# any change you want to survive in here.
#
# Everything needed to sign is in here, so a regenerated project is
# immediately buildable and nothing has to be re-entered in Xcode's UI.
# See "Signing" below.

name: Daily

# The one dependency. supabase-swift carries the session — storing it in the
# keychain, refreshing it before it lapses, and parsing the magic link that
# creates it — and speaks PostgREST, which is where the archive's rules live.
# Hand-rolling token refresh is the kind of code that works until somebody
# leaves the app open overnight.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0

options:
  bundleIdPrefix: com.lewisnichols
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # A generated project has no business being in the repository.
  generateEmptyDirectories: false

settings:
  base:
    # ---------------------------------------------------------------
    # Signing
    #
    # Set once, at the project level, so both the app and the widget
    # inherit it. Setting it in Xcode's Signing & Capabilities tab
    # instead would work exactly until the next `xcodegen`, which
    # rewrites the project file and takes the answer with it.
    # ---------------------------------------------------------------
    DEVELOPMENT_TEAM: 5789FTFX36
    CODE_SIGN_STYLE: Automatic

    # Automatic signing rewrites an entitlements file when it reconciles
    # capabilities against the provisioning profile, and Xcode treats a
    # file changed mid-build as an error rather than doing it quietly.
    # The alternative is re-signing by hand after every regeneration.
    #
    # The warning attached to this setting is about entitlements drifting
    # from what was intended. That does not apply here: both files are
    # generated from the properties below on every `xcodegen`, so the
    # intent is version-controlled and any modification is overwritten
    # the next time the project is built from source.
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    # Swift 6 strict concurrency wants annotations this code does not
    # carry. Nothing here needs the newer language mode.
    SWIFT_VERSION: "5.0"

targets:
  Daily:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets

    dependencies:
      - package: Supabase
        product: Supabase
      # Embeds the extension into the app. Without this the widget builds
      # and is never installed, which looks exactly like a widget iOS has
      # decided not to offer.
      - target: DailyWidget

    entitlements:
      path: Daily.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lewisnichols.daily

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisnichols.daily
        PRODUCT_NAME: Daily
        # A single 1024 is all Xcode 15 and later needs; it makes the rest.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # iPhone only. Nothing here wants a larger canvas.
        TARGETED_DEVICE_FAMILY: "1"

        # WeatherKit is deliberately NOT enabled here. The entitlement
        # fails to sign until the App ID is registered for WeatherKit on
        # the developer portal, which would block the very first build
        # for a field the app is written to do without.
        #
        # Once the App ID is configured, uncomment the entitlements line
        # further down and regenerate.

    # entitlements:
    #   path: Accession.entitlements
    #   properties:
    #     com.apple.developer.weatherkit: true

    info:
      path: Daily/Info.plist
      properties:
        CFBundleDisplayName: Daily
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

        # Without this the app runs letterboxed in a compatibility mode.
        UILaunchScreen: {}

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # Where a magic link comes back to.
        #
        # The link arrives in Mail, is opened by Safari, and has to hand
        # the session to this app rather than to the website. Safari will
        # only do that for a scheme the app has claimed here, so this entry
        # is load-bearing: without it the link opens the website on the
        # phone and the app stays signed out with no visible reason.
        #
        # It must match the redirect registered in the Supabase dashboard
        # under Authentication -> URL Configuration.
        CFBundleURLTypes:
          - CFBundleURLName: com.lewisnichols.daily
            CFBundleURLSchemes:
              - loosenickels

        # Two, not three. The museum asked for the camera because it
        # photographed objects being accessioned; this records the day, and
        # a day is very often already in the library by the time anyone
        # thinks to file it.
        NSCameraUsageDescription: >-
          To photograph the day.

        # Reminders are scheduled on the device and nothing about them
        # leaves it, so there is no push entitlement here and no server
        # involved. iOS still asks; the app asks after the first photograph
        # is recorded rather than at launch, when the question is about
        # something the person can picture.
        NSPhotoLibraryUsageDescription: >-
          To record a photograph you have already taken.
        NSLocationWhenInUseUsageDescription: >-
          To record where a photograph was taken. It is kept private unless
          you choose otherwise, and each day can be set separately.

  # -------------------------------------------------------------------
  # The widget.
  #
  # A separate process with no session and no time. It cannot ask the
  # archive anything, so the app writes what it needs into the App Group
  # and this reads it. Shared/ is compiled into both for that reason, and
  # Tokens.swift comes along so the widget is the same object as the app
  # rather than a lookalike.
  #
  # The App Group must be registered on the developer portal and must
  # match `SharedStore.group`. If it does not, `UserDefaults(suiteName:)`
  # returns nil, both sides quietly do nothing, and the widget shows its
  # empty state for ever with no error reported anywhere.
  # -------------------------------------------------------------------
  DailyWidget:
    type: app-extension
    platform: iOS

    sources:
      - path: Widget
      - path: Shared
      - path: Sources/Tokens.swift

    entitlements:
      path: DailyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lewisnichols.daily

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisnichols.daily.widget
        PRODUCT_NAME: DailyWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Today
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
